name: Riemann Zeta Lean CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean & Build Package
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: "Riemann Zeta"
          build: true
          lint: true
