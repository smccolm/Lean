name: Riemann Zeta GM Foundation Freeze

on:
  push:
    branches: [main]
    tags: ["gm-foundation-*"]
    paths:
      - "Riemann Zeta/**"
      - ".github/workflows/riemann-zeta-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "Riemann Zeta/**"
      - ".github/workflows/riemann-zeta-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prime-foundation-cache:
    name: Prime exact-SHA DFI build cache
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out the exact workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and cache the DFI-heavy proof prefix
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: "Riemann Zeta"
          auto-config: false
          build: true
          build-args: "RiemannZeta.GuthMaynard.DFITheorem1"
          lint: false
          test: false

  verify-foundation-freeze:
    name: Exact contracts, build, audit, and lint
    needs: prime-foundation-cache
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out the exact workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Lean toolchain and dependencies
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: "Riemann Zeta"
          auto-config: false
          build: false
          lint: false
          test: false

      - name: Run the canonical release verifier
        working-directory: "Riemann Zeta"
        shell: pwsh
        run: |
          ./scripts/verify_release.ps1 `
            -Mode release `
            -LogPath "logs/foundation_freeze_${{ github.sha }}.log" `
            -ManifestPath "logs/foundation_freeze_${{ github.sha }}.json"

      - name: Preserve immutable verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gm-foundation-freeze-${{ github.sha }}
          path: |
            Riemann Zeta/logs/foundation_freeze_${{ github.sha }}.log
            Riemann Zeta/logs/foundation_freeze_${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 90
