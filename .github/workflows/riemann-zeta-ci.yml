name: Riemann Zeta Lean CI

on:
  push:
    branches: [ main ]
    paths:
      - "Riemann Zeta/**"
      - ".github/workflows/riemann-zeta-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "Riemann Zeta/**"
      - ".github/workflows/riemann-zeta-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build package
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: "Riemann Zeta"
          build: true
          lint: false

      - name: Run no-sorry audit
        working-directory: "Riemann Zeta"
        shell: bash
        run: |
          set -o pipefail
          lake env lean RiemannZeta/Audit.lean 2>&1 | tee audit.log
          if grep -Fq "sorryAx" audit.log; then
            echo "ERROR: sorryAx dependency detected in core declarations!"
            exit 1
          fi

      - name: Upload audit log artifact
        uses: actions/upload-artifact@v4
        with:
          name: riemann-zeta-audit-log
          path: "Riemann Zeta/audit.log"
