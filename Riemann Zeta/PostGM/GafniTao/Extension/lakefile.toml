name = "GafniTao"
version = "0.1.0"
keywords = ["number-theory", "riemann-zeta", "prime-number-theorem"]
defaultTargets = ["GafniTao"]

[[lean_lib]]
name = "GafniTao"

[[lean_lib]]
name = "RiemannZeta"
